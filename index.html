}

.backdrop-blur {
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform {
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;

:root {
  --bg: #000000;
  --surface: #070707;
  --surface-2: #0c0c0c;
  --line: #1f3a1f;
  --green: #0f0;
  --green-dim: #7dd87d;
  --blue: #6cf;
  --blue-dim: #9db8d6;
  --text: #d7ffd7;
  --muted: #8a9a8a;
  --danger: #ff5d5d;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #070707;
    --surface-2: #0c0c0c;
    --text: #d7ffd7;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .48;
}

input[type="number"] {
  -moz-appearance: textfield;
}

input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

::-moz-selection {
  background: var(--green);
  color: #000;
}

::selection {
  background: var(--green);
  color: #000;
}

.scroll-thin::-webkit-scrollbar {
  height: 6px;
  width: 6px;
}

.scroll-thin::-webkit-scrollbar-thumb {
  background: #234423;
}

@keyframes zylinder-schwank {
  0%, 100% {
    transform: translateX(-50%) translateY(0) rotate(-2.5deg);
  }

  25% {
    transform: translateX(-50%) translateY(-9px) rotate(2deg);
  }

  50% {
    transform: translateX(-50%) translateY(4px) rotate(-1deg);
  }

  75% {
    transform: translateX(-50%) translateY(-6px) rotate(2.5deg);
  }
}

.zylinder-schwank {
  animation: zylinder-schwank 3.2s ease-in-out infinite;
}

@keyframes mystery-schweb {
  0%, 100% {
    transform: translate(-50%, 0) rotate(-6deg);
  }

  50% {
    transform: translate(-50%, -8px) rotate(6deg);
  }
}

.mystery-schweb {
  animation: mystery-schweb 2.4s ease-in-out infinite;
}

@keyframes mystery-glühen {
  0%, 100% {
    box-shadow: 0 0 10px rgba(255,102,200,.7), 0 0 26px rgba(201,166,255,.45);
  }

  50% {
    box-shadow: 0 0 18px rgba(255,102,200,.95), 0 0 38px rgba(201,166,255,.7);
  }
}

.mystery-glühen {
  animation: mystery-glühen 2.4s ease-in-out infinite;
}

input[type="range"].zoom-regler {
  accent-color: #0f0;
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:min-h-\[220px\] {
    min-height: 220px;
  }

  .sm\:w-auto {
    width: auto;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-4 {
    padding-top: 1rem;
    padding-bottom: 1rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));

  }
